MODEL:
  META_ARCHITECTURE: "GeneralizedRCNN"
  BACKBONE:
    NAME: "MAEViTBackbone"
    IMAGE_SIZE: 1024
    PATCH_SIZE: 16
    EMBED_DIM: 768
    DEPTH: 12
    NUM_HEADS: 12
    MLP_RATIO: 4.0
    DROP_PATH_RATE: 0.1
    OUT_FEATURES: [3, 5, 7, 11]  # 选择不同深度的特征层
  ROI_HEADS:
    NAME: "StandardROIHeads"
    NUM_CLASSES: 80  # COCO类别数

DATASETS:
  TRAIN: ("coco_2017_train",)
  TEST: ("coco_2017_val",)
    
SOLVER:
  IMS_PER_BATCH: 16
  BASE_LR: 1e-4
  WEIGHT_DECAY: 0.05
  STEPS: (60000, 80000)
  MAX_ITER: 90000
  CHECKPOINT_PERIOD: 5000

INPUT:
  MIN_SIZE_TRAIN: (640, 672, 704, 736, 768, 800)
  MAX_SIZE_TRAIN: 1333
  MIN_SIZE_TEST: 800
  MAX_SIZE_TEST: 1333